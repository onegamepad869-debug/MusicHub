name: Build MusicHub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: 1.0.${{ github.run_number }}
      TAG: build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Unsigned build: SideStore signs the app with your own Apple ID when it installs it.
      - name: Build app
        run: |
          xcodebuild \
            -project MusicHub.xcodeproj \
            -scheme MusicHub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MusicHub.app Payload/
          zip -qry MusicHub.ipa Payload

      # A SideStore source, so the app shows up in SideStore and updates with one tap.
      - name: Write SideStore source
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os

          repo, tag, version = os.environ["REPO"], os.environ["TAG"], os.environ["VERSION"]
          size = os.path.getsize("MusicHub.ipa")
          date = datetime.date.today().isoformat()
          download = f"https://github.com/{repo}/releases/download/{tag}/MusicHub.ipa"

          source = {
              "name": "MusicHub",
              "identifier": f"io.github.{repo.split('/')[0].lower()}.musichub",
              "apps": [{
                  "name": "MusicHub",
                  "bundleIdentifier": "se.musichub.app",
                  "developerName": repo.split("/")[0],
                  "localizedDescription": "YouTube Music och SoundCloud i en app, utan reklam och med bakgrundsuppspelning.",
                  "iconURL": f"https://raw.githubusercontent.com/{repo}/main/icon.png",
                  "version": version,
                  "versionDate": date,
                  "downloadURL": download,
                  "size": size,
                  "versions": [{
                      "version": version,
                      "date": date,
                      "size": size,
                      "downloadURL": download,
                      "minOSVersion": "16.0",
                  }],
              }],
              "news": [],
          }
          with open("apps.json", "w") as f:
              json.dump(source, f, indent=2)
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MusicHub ${{ env.VERSION }}
          make_latest: true
          files: |
            MusicHub.ipa
            apps.json
